name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run validate
      - uses: astral-sh/setup-uv@v7
      - run: uvx --from skills-ref agentskills validate skills/rustrician
      # The shipped toolkit must keep working on plain Node.js, not just Bun.
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: node skills/rustrician/scripts/rustrician.mjs info branch splitter > /dev/null
