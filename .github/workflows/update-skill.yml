name: Update skill from rustrician.io

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: Regenerate even if rustrician.io is unchanged
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-skill
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Regenerate if rustrician.io changed
        id: gen
        run: bun run generate ${{ inputs.force && '--force' || '' }}

      - name: Verify
        if: steps.gen.outputs.changed == 'true'
        run: |
          bun run typecheck
          bun test
          bun run validate

      - uses: astral-sh/setup-uv@v7
        if: steps.gen.outputs.changed == 'true'

      - name: Validate with the Agent Skills reference validator
        if: steps.gen.outputs.changed == 'true'
        run: uvx --from skills-ref agentskills validate skills/rustrician

      - name: Commit and push
        if: steps.gen.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A skills sources.lock.json
          if git diff --cached --quiet; then
            echo "Sources changed but the generated skill is identical; nothing to commit."
            exit 0
          fi
          git commit -m "chore(skill): sync with rustrician.io ($(date -u +%F))"
          git push
